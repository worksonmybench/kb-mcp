[project]
name = "kb-mcp"
version = "0.1.0"
description = "MCP server over the Gitea repos tagged 'kb': read-only, plus an update inbox"
requires-python = ">=3.12"
dependencies = ["fastmcp==4.0.11", "httpx>=0.27"]

[project.scripts]
kb-mcp = "kb_mcp.server:main"
kb-inbox = "kb_mcp.inbox:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kb_mcp"]
